  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digitaal fotoboek</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a1a;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px;
    }
    /* Zo groot mogelijk in 4:3, zonder dat je hoeft te scrollen */
    .fotoboek {
      width: min(100%, calc((100vh - 24px) * 4 / 3));
      width: min(100%, calc((100dvh - 24px) * 4 / 3));
    }
    /* Haalt de maximale breedte van 1200 pixels van Fotofabriek weg */
    .fotoboek .ff-embedded-preview {
      max-width: none !important;
    }
  </style>
</head>
